# Phase 3 arm: native 2048 input for small filaments, otherwise the YOLO11m 60-epoch recipe (batch 4 to fit memory).
# Batch 2 x 2 accumulation keeps the fold-0 effective batch and warm-up while fitting 24 GB GPUs.
model: yolo11m-seg
pretrained_checkpoint: weights/pretrained/yolo11m-seg.pt
pretrained_sha256: eb9a06f63e2206c35d68d839b08c362429ebecf933ad54c1ad68b2fd001c17cf
fold: 1
seed: 20261010
sampling_policy: coverage
annotator_policy: random
image_size: 2048
mask_ratio: 2
batch_size: 2
gradient_accumulation: 2
epochs: 60
steps_per_epoch: 284
learning_rate: 0.0003
minimum_learning_rate: 0.00001
warmup_steps: 300
weight_decay: 0.0005
validation_every: 60
validation_limit: null
checkpoint_every_steps: 284
mixed_precision: true
score_threshold: 0.2
mask_threshold: 0.5
minimum_area: 150
maximum_area: 50000
maximum_detections: 60
nms_iou: 0.7
time_limit_minutes: 660
scale_jitter: [0.8, 1.25]
translate_jitter: 0.06
num_workers: 7
save_candidates: true
candidate_maximum_detections: 80
