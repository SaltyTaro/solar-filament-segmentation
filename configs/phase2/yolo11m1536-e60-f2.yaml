# Phase 2 five-fold production: YOLO11m-seg long recipe (60 epochs), final EMA weights. Recipe changes versus the 12-epoch pilot:
# real batch 8, 60 epochs, scale/shift jitter, parallel loading, saved candidates.
model: yolo11m-seg
pretrained_checkpoint: weights/pretrained/yolo11m-seg.pt
pretrained_sha256: eb9a06f63e2206c35d68d839b08c362429ebecf933ad54c1ad68b2fd001c17cf
fold: 2
seed: 20261010
sampling_policy: coverage
annotator_policy: random
image_size: 1536
mask_ratio: 2
batch_size: 8
gradient_accumulation: 1
epochs: 60
steps_per_epoch: 71
learning_rate: 0.0003
minimum_learning_rate: 0.00001
warmup_steps: 150
weight_decay: 0.0005
validation_every: 60
validation_limit: null
checkpoint_every_steps: 71
mixed_precision: true
score_threshold: 0.2
mask_threshold: 0.5
minimum_area: 150
maximum_area: 50000
maximum_detections: 60
nms_iou: 0.7
time_limit_minutes: 660
scale_jitter: [0.8, 1.25]
translate_jitter: 0.06
num_workers: 7
save_candidates: true
candidate_maximum_detections: 80
