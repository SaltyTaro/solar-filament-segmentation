[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-filament"
version = "0.1.0"
description = "Reproducible solar filament instance segmentation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.1",
    "Pillow==11.3.0",
    "pycocotools==2.0.11",
    "opencv-python-headless==4.12.0.88",
    "PyYAML==6.0.2",
    "tqdm==4.67.1",
    "python-dotenv==1.1.1",
    "kaggle==2.2.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.9"]
train = ["torch==2.8.0", "torchvision==0.23.0"]
report = ["matplotlib==3.10.7", "IPython==9.6.0", "PyMuPDF==1.26.5"]

[project.scripts]
solar-filament = "solar_filament.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
